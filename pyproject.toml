[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cs2pppp"
version = "0.2.7"
description = "Stdlib Python client for the CS2 PPPP wire protocol and app JSON, with caller-supplied directory servers (probe, session, TF list/download)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "cs2pppp contributors" }]
keywords = ["pppp", "cs2", "iot", "camera", "p2p", "udp"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/wmarquardt/cs2-pppp"
Source = "https://github.com/wmarquardt/cs2-pppp"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/cs2pppp"]

[tool.hatch.build.targets.sdist]
include = ["src/cs2pppp", "README.md", "LICENSE", "tests", "examples"]

[tool.pytest.ini_options]
markers = ["live: requires real hardware; gated by CS2_LIVE=1"]
